<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="霓虹流变 NEON FLUX —— 控制光球穿越彩色光门，切换颜色匹配通行，考验反应与节奏的霓虹街机小游戏。">
<title>NEON FLUX · 霓虹流变</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060f'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%235ef2ff'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23ff5ec8' stroke-width='4' stroke-dasharray='14 18'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05060f;
    --bg2:#0a0a1f;
    --ink:#eaf4ff;
    --muted:#7f96b8;
    --cyan:#5ef2ff;
    --pink:#ff5ec8;
    --violet:#a78bff;
    --lime:#baff5e;
    --yellow:#ffd84d;
    --glass:rgba(12,16,34,.62);
    --line:rgba(120,170,255,.14);
    --font:ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);touch-action:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* HUD */
  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;pointer-events:none;z-index:5}
  .hud .score-box{display:flex;flex-direction:column;gap:2px}
  .hud .label{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .hud .score{font-size:30px;font-weight:800;line-height:1;color:var(--cyan);text-shadow:0 0 18px rgba(94,242,255,.55)}
  .hud .best{font-size:13px;color:var(--pink);text-shadow:0 0 12px rgba(255,94,200,.5)}
  .hud .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .pause-btn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .pause-btn:active{transform:scale(.92)}

  .cheat-badge{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);z-index:6;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.05em;background:rgba(255,216,77,.14);border:1px solid var(--yellow);color:var(--yellow);box-shadow:0 0 18px rgba(255,216,77,.35);display:none;animation:pulse-badge 1.6s ease-in-out infinite}
  @keyframes pulse-badge{0%,100%{box-shadow:0 0 14px rgba(255,216,77,.3)}50%{box-shadow:0 0 26px rgba(255,216,77,.65)}}

  /* Overlays */
  .overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,rgba(20,22,50,.6) 0%,rgba(5,6,15,.86) 70%);backdrop-filter:blur(6px)}
  .overlay.hidden{display:none}
  .brand{font-size:12px;letter-spacing:.5em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
  .title{font-size:clamp(38px,9vw,68px);font-weight:900;letter-spacing:.02em;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--violet),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(167,139,255,.45));line-height:1.05}
  .subtitle{font-size:clamp(15px,3.6vw,20px);color:var(--ink);margin-top:10px;opacity:.92}
  .sub-zh{font-size:clamp(13px,3.2vw,16px);color:var(--muted);margin-top:6px}
  .desc{margin-top:22px;font-size:13.5px;line-height:1.7;color:var(--muted);max-width:420px}
  .desc b{color:var(--ink);font-weight:600}
  .keys{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .key{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--glass);font-size:12px;color:var(--ink)}
  .key .k{color:var(--cyan);font-weight:700;margin-right:6px}

  .btn{pointer-events:auto;margin-top:26px;padding:14px 34px;border-radius:14px;border:none;font-size:16px;font-weight:800;letter-spacing:.04em;cursor:pointer;color:#05060f;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 28px rgba(94,242,255,.4);transition:.18s;font-family:var(--font)}
  .btn:active{transform:scale(.95)}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:12px;font-weight:600;font-size:14px;padding:11px 24px}

  .end-stats{display:flex;gap:28px;margin-top:18px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat .n{font-size:34px;font-weight:900}
  .stat .n.s{color:var(--cyan);text-shadow:0 0 16px rgba(94,242,255,.5)}
  .stat .n.b{color:var(--pink);text-shadow:0 0 16px rgba(255,94,200,.5)}
  .stat .l{font-size:11px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}
  .new-best{margin-top:10px;font-size:14px;color:var(--yellow);font-weight:700;letter-spacing:.05em;animation:pulse-badge 1.2s infinite}

  /* Color cycle hint */
  .cycle-hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 66px);left:16px;display:flex;gap:7px;z-index:4;pointer-events:none;align-items:center}
  .cycle-hint .cur-label{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-right:2px;text-transform:uppercase}
  .dot{width:13px;height:13px;border-radius:50%;box-shadow:0 0 8px currentColor;opacity:.35;transform:scale(.85);transition:.18s}
  .dot.active{opacity:1;transform:scale(1.35);box-shadow:0 0 16px currentColor,0 0 0 2px rgba(255,255,255,.9)}

  /* 移动端触控按钮 */
  .touch-controls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;display:none;justify-content:center;align-items:center;gap:14px;z-index:5;padding:0 18px}
  .tc-btn{pointer-events:auto;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);border-radius:16px;font-family:var(--font);font-weight:800;font-size:22px;width:76px;height:60px;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .tc-btn.tc-switch{width:auto;min-width:130px;flex:1;max-width:190px;font-size:16px;letter-spacing:.06em;background:linear-gradient(90deg,rgba(94,242,255,.22),rgba(255,94,200,.22));border-color:rgba(94,242,255,.5);color:#fff}
  .tc-btn:active{transform:scale(.93);background:rgba(94,242,255,.28)}
  @media (max-width:820px), (hover:none) and (pointer:coarse){
    .touch-controls{display:flex}
    .cycle-hint{opacity:1}
  }
  .hint-bar{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--violet),var(--lime));opacity:.35;z-index:3;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hint-bar"></div>

  <div class="hud">
    <div class="score-box">
      <div class="label">Score</div>
      <div class="score" id="score">0</div>
    </div>
    <div class="right">
      <div class="best">BEST <span id="best">0</span></div>
      <button class="pause-btn" id="pauseBtn" aria-label="pause">❚❚</button>
    </div>
  </div>

  <div class="cheat-badge" id="cheatBadge">⚡ 作弊模式 · 无敌穿越</div>

  <div class="cycle-hint" id="colorHint">
    <span class="cur-label">当前色</span>
    <div class="dot active" id="cDot0" style="color:var(--cyan);background:var(--cyan)"></div>
    <div class="dot" id="cDot1" style="color:var(--pink);background:var(--pink)"></div>
    <div class="dot" id="cDot2" style="color:var(--violet);background:var(--violet)"></div>
    <div class="dot" id="cDot3" style="color:var(--lime);background:var(--lime)"></div>
  </div>

  <!-- 移动端触控按钮 -->
  <div class="touch-controls" id="touchControls">
    <button class="tc-btn" id="tcLeft" aria-label="left">◀</button>
    <button class="tc-btn tc-switch" id="tcSwitch" aria-label="switch color">切换颜色</button>
    <button class="tc-btn" id="tcRight" aria-label="right">▶</button>
  </div>

  <!-- Start overlay -->
  <div class="overlay" id="startOverlay">
    <div class="brand">NEON ARCADE</div>
    <div class="title">NEON FLUX</div>
    <div class="subtitle">霓虹流变</div>
    <div class="sub-zh">让光，穿过同色的门</div>
    <div class="desc">
      光球会持续下落，<b>光门</b>从上方压来。<br>
      移动光球到与自身<b>同色</b>的光段即可穿越，颜色不符则炸裂。<br>
      沿路收集 <b style="color:var(--yellow)">★ 晶体</b> 获得额外分数，撑得越久越快。
    </div>
    <div class="keys">
      <div class="key"><span class="k">移动鼠标 / ← →</span>移动</div>
      <div class="key"><span class="k">点击 / 空格</span>切换颜色</div>
      <div class="key"><span class="k">P</span>暂停</div>
    </div>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <!-- Pause overlay -->
  <div class="overlay hidden" id="pauseOverlay">
    <div class="brand">PAUSED</div>
    <div class="title" style="font-size:clamp(30px,7vw,52px)">已暂停</div>
    <div class="sub-zh">深呼吸，稳住节奏</div>
    <button class="btn" id="resumeBtn">继续游戏</button>
    <button class="btn secondary" id="restartBtnPause">重新开始</button>
  </div>

  <!-- End overlay -->
  <div class="overlay hidden" id="endOverlay">
    <div class="brand">GAME OVER</div>
    <div class="title" style="font-size:clamp(30px,7vw,52px);background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent">光熄了</div>
    <div class="end-stats">
      <div class="stat"><div class="n s" id="finalScore">0</div><div class="l">Score</div></div>
      <div class="stat"><div class="n b" id="finalBest">0</div><div class="l">Best</div></div>
    </div>
    <div class="new-best hidden" id="newBest">★ 新纪录！</div>
    <button class="btn" id="restartBtn">再来一次</button>
    <button class="btn secondary" id="homeBtn">回到主页</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ========================= 基础设置 ========================= */
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const COLORS = [
    { name:'cyan',   hex:'#5ef2ff', rgb:[94,242,255] },
    { name:'pink',   hex:'#ff5ec8', rgb:[255,94,200] },
    { name:'violet', hex:'#a78bff', rgb:[167,139,255] },
    { name:'lime',   hex:'#baff5e', rgb:[186,255,94] },
  ];

  const STATE = { START:0, PLAYING:1, PAUSED:2, END:3 };
  let state = STATE.START;

  /* ========================= 画布适配 ========================= */
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = W * DPR;
    cv.height = H * DPR;
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ========================= 游戏实体 ========================= */
  const player = {
    x: 0, y: 0, r: 16,
    tx: 0,          // target x (for touch/mouse)
    colorIdx: 0,
    vx: 0,
    trail: [],
    pulse: 0,
    dead: false,
  };

  let gates = [];      // {y, h, segments:[{x,w,colorIdx}], passed}
  let stars = [];      // {x, y, r, collected, phase}
  let particles = [];
  let shockwaves = [];

  let score = 0;
  let bestScore = +(localStorage.getItem('neon-flux-best') || 0);
  let fallSpeed = 0;
  let spawnTimer = 0;
  let starTimer = 0;
  let shake = 0;
  let timeElapsed = 0;
  let lastTs = 0;

  /* 作弊 */
  let cheatActive = false;
  const konamiTarget = 'axisihuairen';
  let konamiBuf = '';

  /* ========================= 音效 ========================= */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }
  function playSfx(type){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const make = (freq, dur, type='sine', vol=0.15, slide=null) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      if(slide) o.frequency.exponentialRampToValueAtTime(slide, now+dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now+dur);
    };
    switch(type){
      case 'switch': make(520+player.colorIdx*120, 0.09, 'square', 0.10, 700+player.colorIdx*140); break;
      case 'pass':   make(660, 0.12, 'triangle', 0.16, 990); break;
      case 'star':   make(880, 0.08, 'sine', 0.14); setTimeout(()=>make(1320,0.10,'sine',0.12),70); break;
      case 'dead':   make(220, 0.5, 'sawtooth', 0.22, 60); break;
      case 'cheat':  [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>make(f,0.18,'triangle',0.16),i*70)); break;
    }
  }

  /* ========================= 游戏状态 ========================= */
  function resetGame(){
    player.x = W/2;
    player.tx = W/2;
    player.y = H - 110;
    player.colorIdx = 0;
    player.vx = 0;
    player.trail = [];
    player.pulse = 0;
    player.dead = false;
    gates = [];
    stars = [];
    particles = [];
    shockwaves = [];
    score = 0;
    timeElapsed = 0;
    fallSpeed = 140;
    spawnTimer = 999;   // 首帧立即生成第一道门，避免开局空等
    starTimer = 0;
    shake = 0;
    updateHUD();
    updateColorHint();
  }

  function startGame(){
    ensureAudio();
    resetGame();
    state = STATE.PLAYING;
    hideOverlays();
  }

  function gameOver(){
    if(state !== STATE.PLAYING) return;
    state = STATE.END;
    player.dead = true;
    shake = 22;
    playSfx('dead');
    explode(player.x, player.y, COLORS[player.colorIdx].hex, 50, 8);
    shockwaves.push({x:player.x,y:player.y,r:10,maxR:260,color:COLORS[player.colorIdx].hex,life:1});
    shockwaves.push({x:player.x,y:player.y,r:10,maxR:180,color:'#ff5ec8',life:1});
    const isNew = score > bestScore;
    if(isNew){ bestScore = score; localStorage.setItem('neon-flux-best', bestScore); }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = bestScore;
    document.getElementById('newBest').classList.toggle('hidden', !isNew);
    setTimeout(()=>{
      showOverlay('endOverlay');
    }, 650);
  }

  function togglePause(){
    if(state === STATE.PLAYING){
      state = STATE.PAUSED;
      showOverlay('pauseOverlay');
    } else if(state === STATE.PAUSED){
      state = STATE.PLAYING;
      hideOverlays();
    }
  }

  function showOverlay(id){
    document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }
  function hideOverlays(){
    document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'));
  }

  function updateHUD(){
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = bestScore;
    document.getElementById('cheatBadge').style.display = cheatActive ? 'block' : 'none';
  }

  /* ========================= 生成 ========================= */
  function makeGate(y){
    // 难度越高，段数越多
    const segCount = Math.min(4, 2 + Math.floor(score / 8));
    const h = Math.max(14, 26 - score*0.15);
    const segW = W / segCount;
    const segments = [];
    // 随机打乱颜色，确保不全部相同
    const pool = [0,1,2,3];
    const used = [];
    for(let i=0;i<segCount;i++){
      const ci = pool[Math.floor(Math.random()*pool.length)];
      used.push(ci);
      segments.push({ x: i*segW, w: segW, colorIdx: ci });
    }
    // 保证至少两种颜色，避免无脑
    if(used.every(c=>c===used[0])){
      segments[Math.floor(Math.random()*segCount)].colorIdx = (used[0]+1)%4;
    }
    // 第一道门：让光球初始位置所在段与出生颜色一致，避免开局被随机色秒杀
    if(gates.length === 0){
      const startIdx = Math.min(segCount-1, Math.floor((W/2) / segW));
      segments[startIdx].colorIdx = 0;
    }
    gates.push({ y, h, segments, passed:false });
  }

  function makeStar(){
    stars.push({
      x: 40 + Math.random()*(W-80),
      y: -20,
      r: 9,
      collected:false,
      phase: Math.random()*Math.PI*2,
    });
  }

  function explode(x,y,color,count=30,speed=6){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const s = Math.random()*speed + 1;
      particles.push({
        x, y,
        vx: Math.cos(a)*s,
        vy: Math.sin(a)*s,
        life: 1,
        decay: 0.015 + Math.random()*0.025,
        color,
        size: 2 + Math.random()*3,
      });
    }
  }

  /* ========================= 更新 ========================= */
  function update(dt){
    if(state !== STATE.PLAYING) return;
    timeElapsed += dt;

    // 难度递增
    fallSpeed = 140 + Math.min(250, score * 2.2 + timeElapsed * 0.012);

    /* 玩家水平移动：键盘 > 触控拖动 > 鼠标跟随 */
    const moveSpeed = 380;
    const maxV = moveSpeed * 1.8;
    if(keys.left){ player.vx = -moveSpeed; }
    else if(keys.right){ player.vx = moveSpeed; }
    else if(pointer.dragging){
      // 触控拖动：跟随手指
      const dx = pointer.x - player.x;
      player.vx = Math.max(-maxV, Math.min(maxV, dx * 14));
    }
    else if(!isTouch && mouseActive){
      // 桌面端：鼠标悬停即可移动，降低上手门槛
      const dx = mouseX - player.x;
      player.vx = Math.abs(dx) < 1 ? 0 : Math.max(-maxV, Math.min(maxV, dx * 12));
    }
    else { player.vx = 0; }
    player.x += player.vx * dt;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));

    player.pulse += dt * 6;

    /* 拖尾 */
    player.trail.unshift({x:player.x, y:player.y, color:COLORS[player.colorIdx].hex});
    if(player.trail.length > 14) player.trail.pop();

    /* 生成光门 */
    spawnTimer += dt;
    const gateInterval = Math.max(0.55, 1.15 - score*0.008);
    if(spawnTimer > gateInterval){
      spawnTimer = 0;
      const topGateY = gates.length ? gates[gates.length-1].y : -40;
      const gap = 150 + Math.random()*70 - Math.min(50, score*0.6);
      makeGate(topGateY - Math.max(120, gap));
    }

    /* 生成晶体 */
    starTimer += dt;
    if(starTimer > 1.4 && Math.random()<0.7){
      starTimer = 0;
      makeStar();
    }

    /* 光门下移 + 碰撞 */
    for(let i=gates.length-1;i>=0;i--){
      const g = gates[i];
      g.y += fallSpeed * dt;
      // 检测玩家是否穿过此门
      if(!g.passed && g.y + g.h >= player.y && g.y <= player.y + player.r*2){
        // 找到玩家所在段
        const seg = g.segments.find(s => player.x >= s.x && player.x < s.x + s.w);
        if(seg){
          if(cheatActive || seg.colorIdx === player.colorIdx){
            g.passed = true;
            score += 1;
            playSfx('pass');
            const col = cheatActive ? '#ffd84d' : COLORS[seg.colorIdx].hex;
            explode(player.x, g.y+g.h/2, col, 18, 4);
            shockwaves.push({x:player.x,y:g.y+g.h/2,r:6,maxR:90,color:col,life:1});
            updateHUD();
          } else {
            gameOver();
            return;
          }
        }
      }
      if(g.y > H + 60) gates.splice(i,1);
    }

    /* 晶体 */
    for(let i=stars.length-1;i>=0;i--){
      const s = stars[i];
      s.y += fallSpeed * 0.8 * dt;
      s.phase += dt*4;
      if(!s.collected){
        // 作弊自动吸附
        if(cheatActive){
          const dx = player.x - s.x, dy = player.y - s.y;
          const d = Math.hypot(dx,dy);
          if(d < 130){
            s.x += dx/d * 260 * dt;
            s.y += dy/d * 260 * dt;
          }
        }
        if(Math.hypot(s.x-player.x, s.y-player.y) < player.r + s.r){
          s.collected = true;
          score += 3;
          playSfx('star');
          explode(s.x, s.y, '#ffd84d', 22, 5);
          updateHUD();
        }
      }
      if(s.y > H + 30 || s.collected) stars.splice(i,1);
    }

    /* 粒子 */
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= p.decay;
      if(p.life <= 0) particles.splice(i,1);
    }

    /* 冲击波 */
    for(let i=shockwaves.length-1;i>=0;i--){
      const s = shockwaves[i];
      s.r += (s.maxR - s.r) * 0.12;
      s.life -= 0.04;
      if(s.life <= 0) shockwaves.splice(i,1);
    }

    if(shake > 0) shake = Math.max(0, shake - dt*60);
  }

  /* ========================= 渲染 ========================= */
  function render(){
    ctx.clearRect(0,0,W,H);

    // 背景渐变
    const bg = ctx.createRadialGradient(W/2, H*0.3, 40, W/2, H*0.5, Math.max(W,H)*0.8);
    bg.addColorStop(0, '#0c0f24');
    bg.addColorStop(0.6, '#060714');
    bg.addColorStop(1, '#03030a');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // 动态网格
    drawGrid();

    ctx.save();
    if(shake > 0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // 光门
    for(const g of gates){
      for(const seg of g.segments){
        const c = COLORS[seg.colorIdx];
        ctx.save();
        ctx.shadowColor = c.hex;
        ctx.shadowBlur = cheatActive ? 24 : 16;
        ctx.fillStyle = c.hex;
        ctx.globalAlpha = 0.88;
        roundRect(ctx, seg.x, g.y, seg.w, g.h, 3);
        ctx.fill();
        // 高光
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#fff';
        roundRect(ctx, seg.x, g.y, seg.w, g.h*0.35, 3);
        ctx.fill();
        ctx.restore();
      }
      // 门分隔线
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2;
      for(let i=1;i<g.segments.length;i++){
        ctx.beginPath();
        ctx.moveTo(g.segments[i].x, g.y);
        ctx.lineTo(g.segments[i].x, g.y+g.h);
        ctx.stroke();
      }
    }

    // 晶体
    for(const s of stars){
      if(s.collected) continue;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.phase*0.3);
      ctx.shadowColor = '#ffd84d';
      ctx.shadowBlur = 18 + Math.sin(s.phase)*6;
      ctx.fillStyle = '#ffd84d';
      drawStar(ctx, 0, 0, 5, s.r, s.r*0.45);
      ctx.fill();
      ctx.restore();
    }

    // 冲击波
    for(const s of shockwaves){
      ctx.save();
      ctx.globalAlpha = s.life * 0.7;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3 * s.life;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    // 粒子
    for(const p of particles){
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 玩家拖尾
    if(!player.dead){
      for(let i=player.trail.length-1;i>=0;i--){
        const t = player.trail[i];
        const a = (1 - i/player.trail.length) * 0.35;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = cheatActive ? '#ffd84d' : t.color;
        ctx.shadowColor = cheatActive ? '#ffd84d' : t.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(t.x, t.y, player.r*(1 - i/player.trail.length*0.6), 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      // 玩家本体
      const pcol = cheatActive ? rainbowColor(timeElapsed) : COLORS[player.colorIdx].hex;
      const pulse = 1 + Math.sin(player.pulse)*0.06;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(pulse, pulse);
      ctx.shadowColor = pcol;
      ctx.shadowBlur = 30;
      // 外环
      ctx.strokeStyle = pcol;
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(0, 0, player.r+5, 0, Math.PI*2);
      ctx.stroke();
      // 内核
      ctx.globalAlpha = 1;
      const grad = ctx.createRadialGradient(0,0,0,0,0,player.r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, pcol);
      grad.addColorStop(1, pcol);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, player.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      // 作弊光环
      if(cheatActive){
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(timeElapsed*3);
        ctx.strokeStyle = 'rgba(255,216,77,0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6,10]);
        ctx.beginPath();
        ctx.arc(0,0,player.r+12,0,Math.PI*2);
        ctx.stroke();
        ctx.restore();
      }
    }

    ctx.restore();
  }

  function drawGrid(){
    ctx.save();
    ctx.strokeStyle = 'rgba(120,170,255,0.06)';
    ctx.lineWidth = 1;
    const step = 44;
    const offset = (timeElapsed * 30) % step;
    ctx.beginPath();
    for(let y = -step + offset; y < H; y += step){
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    for(let x = 0; x < W; x += step){
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    ctx.stroke();
    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawStar(ctx,cx,cy,spikes,outer,inner){
    let rot = Math.PI/2*3;
    const step = Math.PI/spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy-outer);
    for(let i=0;i<spikes;i++){
      ctx.lineTo(cx+Math.cos(rot)*outer, cy+Math.sin(rot)*outer);
      rot += step;
      ctx.lineTo(cx+Math.cos(rot)*inner, cy+Math.sin(rot)*inner);
      rot += step;
    }
    ctx.lineTo(cx, cy-outer);
    ctx.closePath();
  }

  function rainbowColor(t){
    const hue = (t * 80) % 360;
    return `hsl(${hue}, 100%, 62%)`;
  }

  /* ========================= 主循环 ========================= */
  function tick(ts){
    // 单一常驻循环：任何状态都持续渲染，避免画面冻结
    let dt = (ts - lastTs) / 1000;
    if(!isFinite(dt) || dt < 0) dt = 0.016;
    dt = Math.min(0.05, dt);
    lastTs = ts;
    if(state === STATE.PLAYING){
      update(dt);           // update 内部会推进 timeElapsed
    } else {
      timeElapsed += dt;    // 非游戏状态让背景/光球保持细微动画
    }
    render();
    requestAnimationFrame(tick);
  }

  /* ========================= 输入 ========================= */
  const keys = { left:false, right:false };
  const pointer = { active:false, dragging:false, x:0, y:0, startX:0, startY:0, startTime:0 };
  let isTouch = false;
  let mouseX = 0;
  let mouseActive = false;

  function cycleColor(){
    if(state !== STATE.PLAYING) return;
    player.colorIdx = (player.colorIdx + 1) % COLORS.length;
    player.pulse = 0;
    updateColorHint();
    playSfx('switch');
  }

  function updateColorHint(){
    for(let i=0;i<COLORS.length;i++){
      const el = document.getElementById('cDot'+i);
      if(el) el.classList.toggle('active', i === player.colorIdx);
    }
  }

  document.addEventListener('keydown', e=>{
    // 作弊码
    konamiBuf += e.key.toLowerCase();
    if(konamiBuf.length > konamiTarget.length + 4){
      konamiBuf = konamiBuf.slice(-konamiTarget.length);
    }
    if(checkKonami(konamiBuf)){
      triggerCheat();
      konamiBuf = '';
    }

    if(e.code==='ArrowLeft' || e.key==='a' || e.key==='A'){ keys.left = true; }
    if(e.code==='ArrowRight' || e.key==='d' || e.key==='D'){ keys.right = true; }
    if(e.code==='Space'){
      if(state===STATE.START){ startGame(); }
      else if(state===STATE.END){ startGame(); }
      else if(state===STATE.PLAYING){ cycleColor(); }
      else if(state===STATE.PAUSED){ togglePause(); }
      e.preventDefault();
    }
    if(e.key==='p' || e.key==='P'){
      if(state===STATE.PLAYING || state===STATE.PAUSED) togglePause();
    }
    if(e.code==='ArrowUp' || e.key==='w' || e.key==='W'){
      if(state===STATE.PLAYING) cycleColor();
    }
  });

  document.addEventListener('keyup', e=>{
    if(e.code==='ArrowLeft' || e.key==='a' || e.key==='A') keys.left = false;
    if(e.code==='ArrowRight' || e.key==='d' || e.key==='D') keys.right = false;
  });

  function checkKonami(input){
    const target = konamiTarget;
    let i = 0;
    for(const ch of input){
      if(ch === target[i]){
        i++;
        if(i === target.length) return true;
      } else {
        i = ch === target[0] ? 1 : 0;
      }
    }
    return false;
  }

  function triggerCheat(){
    cheatActive = !cheatActive;
    playSfx('cheat');
    explode(player.x, player.y, '#ffd84d', 40, 7);
    shockwaves.push({x:player.x,y:player.y,r:10,maxR:220,color:'#ffd84d',life:1});
    shockwaves.push({x:player.x,y:player.y,r:10,maxR:160,color:'#5ef2ff',life:1});
    updateHUD();
  }

  /* 触摸 / 鼠标 */
  function onPointerDown(e){
    ensureAudio();
    isTouch = true;
    const p = getPoint(e);
    pointer.active = true;
    pointer.dragging = false;
    pointer.x = p.x; pointer.y = p.y;
    pointer.startX = p.x; pointer.startY = p.y;
    pointer.startTime = performance.now();
  }
  function onPointerMove(e){
    if(!pointer.active) return;
    const p = getPoint(e);
    pointer.x = p.x; pointer.y = p.y;
    // 超过阈值才视为拖动，纯轻点不算移动
    if(!pointer.dragging){
      const dx = p.x - pointer.startX, dy = p.y - pointer.startY;
      if(Math.hypot(dx,dy) > 14) pointer.dragging = true;
    }
  }
  function onPointerUp(e){
    if(!pointer.active) return;
    const wasDrag = pointer.dragging;
    pointer.active = false;
    pointer.dragging = false;
    if(!wasDrag) cycleColor();   // 轻点只切色，不再把光球拽走
  }
  function getPoint(e){
    if(e.touches && e.touches.length){
      return { x:e.touches[0].clientX, y:e.touches[0].clientY };
    }
    return { x:e.clientX, y:e.clientY };
  }

  /* 触控（仅 canvas） */
  cv.addEventListener('touchstart', onPointerDown, {passive:true});
  cv.addEventListener('touchmove', onPointerMove, {passive:true});
  cv.addEventListener('touchend', onPointerUp, {passive:true});
  cv.addEventListener('touchcancel', ()=>{ pointer.active=false; pointer.dragging=false; }, {passive:true});
  // 任意触摸一旦发生即切换到触控模式，关闭鼠标跟随
  document.addEventListener('touchstart', ()=>{ isTouch = true; }, {passive:true});

  /* 桌面鼠标：悬停移动 + 点击切色 */
  window.addEventListener('mousemove', e=>{
    if(isTouch) return;
    mouseActive = true; mouseX = e.clientX;
  });
  cv.addEventListener('click', ()=>{
    if(isTouch) return;
    cycleColor();
  });

  /* 移动端屏幕按钮 */
  const holdBtn = (el, key) => {
    if(!el) return;
    const on = ev => { ev.preventDefault(); ev.stopPropagation(); isTouch = true; ensureAudio(); keys[key] = true; };
    const off = ev => { if(ev) ev.preventDefault(); keys[key] = false; };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  };
  holdBtn(document.getElementById('tcLeft'), 'left');
  holdBtn(document.getElementById('tcRight'), 'right');
  const swBtn = document.getElementById('tcSwitch');
  if(swBtn){
    swBtn.addEventListener('pointerdown', ev=>{
      ev.preventDefault(); ev.stopPropagation(); isTouch = true; ensureAudio(); cycleColor();
    });
  }

  /* 按钮 */
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('restartBtnPause').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('pauseBtn').addEventListener('click', ()=>{
    if(state===STATE.PLAYING || state===STATE.PAUSED) togglePause();
  });
  document.getElementById('homeBtn').addEventListener('click', ()=>{
    state = STATE.START;
    showOverlay('startOverlay');
    updateColorHint();
  });

  /* 旋转/尺寸变化时保持光球在可视区域内，避免"看不到球" */
  window.addEventListener('resize', ()=>{
    player.y = H - 110;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    mouseX = Math.max(player.r, Math.min(W - player.r, mouseX || W/2));
  });

  /* 初始化 */
  updateHUD();
  updateColorHint();
  player.x = W/2; player.y = H - 110;
  mouseX = W/2;
  mouseActive = false;
  lastTs = performance.now();
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
