<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>光谱漩涡 · Spectrum Vortex</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a1a;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #fff;
    touch-action: none;
    user-select: none;
  }
  body {
    background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 70%);
  }
  #gameCanvas {
    display: block;
    width: 100%; height: 100%;
    position: absolute; top: 0; left: 0;
  }

  /* ===== HUD ===== */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  .hud-box {
    background: rgba(15, 5, 35, 0.75);
    border: 1px solid rgba(180, 100, 255, 0.35);
    border-radius: 12px;
    padding: 8px 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(150, 80, 255, 0.15);
  }
  .hud-label {
    font-size: 10px; letter-spacing: 2px; color: #a78bfa; text-transform: uppercase;
  }
  .hud-value {
    font-size: 22px; font-weight: 700;
    text-shadow: 0 0 10px currentColor;
  }
  #scoreValue { color: #f0abfc; }
  #comboValue { color: #fbbf24; }
  #livesValue { color: #f87171; }

  /* ===== Overlays ===== */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(5, 2, 15, 0.88);
    backdrop-filter: blur(12px);
    z-index: 100;
    padding: 20px;
  }
  .overlay.hidden { display: none; }

  .game-title {
    font-size: clamp(36px, 8vw, 72px);
    font-weight: 900;
    background: linear-gradient(135deg, #f472b6, #a78bfa, #60a5fa, #34d399, #fbbf24);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 4s ease infinite;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .game-subtitle {
    font-size: clamp(12px, 2.5vw, 16px);
    color: #a78bfa;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .btn {
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    color: #fff; border: none;
    padding: 14px 48px;
    font-size: 18px; font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    pointer-events: auto;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(168, 85, 247, 0.8); }
  .btn:active { transform: scale(0.98); }

  .instructions {
    margin-top: 28px;
    text-align: center;
    color: #94a3b8;
    font-size: clamp(12px, 2.5vw, 15px);
    line-height: 1.8;
    max-width: 480px;
  }
  .instructions strong { color: #e0e7ff; }
  .key-hint {
    display: inline-block;
    background: rgba(167, 139, 250, 0.15);
    border: 1px solid rgba(167, 139, 250, 0.4);
    border-radius: 6px;
    padding: 2px 10px;
    margin: 2px;
    font-size: 13px;
    color: #c4b5fd;
  }

  .final-score {
    font-size: clamp(20px, 4vw, 28px);
    color: #f0abfc;
    margin-bottom: 6px;
  }
  .final-best {
    font-size: clamp(14px, 2.5vw, 18px);
    color: #fbbf24;
    margin-bottom: 24px;
  }

  /* ===== Color Switcher (mobile) ===== */
  #colorSwitcher {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px;
    z-index: 20;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #colorSwitcher.visible { opacity: 1; }
  .color-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 15px currentColor;
    position: relative;
  }
  .color-btn.active {
    border-color: #fff;
    transform: scale(1.15);
    box-shadow: 0 0 30px currentColor, 0 0 50px currentColor;
  }
  @media (min-width: 769px) {
    #colorSwitcher { opacity: 0.3; }
  }

  /* ===== Cheat indicator ===== */
  #cheatIndicator {
    position: absolute;
    top: 80px; right: 18px;
    background: rgba(251, 191, 36, 0.2);
    border: 1px solid #fbbf24;
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 12px; color: #fbbf24;
    letter-spacing: 2px;
    z-index: 15;
    display: none;
    pointer-events: none;
    animation: pulse 1.5s ease infinite;
  }
  #cheatIndicator.active { display: block; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ===== Combo popup ===== */
  .combo-popup {
    position: absolute;
    pointer-events: none;
    font-weight: 900;
    text-shadow: 0 0 20px currentColor;
    animation: comboFloat 1s ease-out forwards;
    z-index: 30;
  }
  @keyframes comboFloat {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -100%) scale(1); opacity: 0; }
  }

  /* ===== Responsive tweaks ===== */
  @media (max-width: 480px) {
    .hud-box { padding: 6px 12px; }
    .hud-value { font-size: 18px; }
    .color-btn { width: 44px; height: 44px; }
    #colorSwitcher { gap: 8px; bottom: 14px; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-box">
    <div class="hud-label">分数 / SCORE</div>
    <div class="hud-value" id="scoreValue">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">连击 / COMBO</div>
    <div class="hud-value" id="comboValue">0x</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">生命 / LIVES</div>
    <div class="hud-value" id="livesValue">♥♥♥</div>
  </div>
</div>

<div id="cheatIndicator">★ 作弊模式 ★</div>

<!-- Mobile color switcher -->
<div id="colorSwitcher"></div>

<!-- Start Screen -->
<div class="overlay" id="startOverlay">
  <div class="game-title">光谱漩涡</div>
  <div class="game-subtitle">SPECTRUM VORTEX</div>
  <button class="btn" id="startBtn">开始游戏</button>
  <div class="instructions">
    <p><strong>玩法：</strong>控制彩色漩涡，吸收<span style="color:#6ee7b7">相同颜色</span>的光点得分！</p>
    <p>避开<span style="color:#f87171">不同颜色</span>的光点，否则扣分扣生命</p>
    <p style="margin-top:12px">
      <span class="key-hint">鼠标移动</span> 或 <span class="key-hint">触摸拖动</span> 控制漩涡<br>
      <span class="key-hint">1-4</span> / <span class="key-hint">Q W E R</span> 切换颜色
    </p>
    <p style="margin-top:12px;color:#a78bfa">最高分：<span id="bestScoreDisplay">0</span></p>
  </div>
</div>

<!-- Game Over Screen -->
<div class="overlay hidden" id="gameOverOverlay">
  <div class="game-title" style="background: linear-gradient(135deg, #f87171, #a78bfa); -webkit-background-clip: text; background-clip: text;">游戏结束</div>
  <div class="final-score">本局得分：<span id="finalScore">0</span></div>
  <div class="final-best">最高分：<span id="finalBest">0</span></div>
  <button class="btn" id="restartBtn">再来一局</button>
</div>

<script>
/* ========================================================
   光谱漩涡 Spectrum Vortex
   单文件 HTML 游戏 — 赛博朋克霓虹风格
   ======================================================== */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

/* ---------- Constants ---------- */
const COLORS = [
  { name: 'pink',    hex: '#f472b6', glow: 'rgba(244, 114, 182, ' },
  { name: 'blue',    hex: '#60a5fa', glow: 'rgba(96, 165, 250, ' },
  { name: 'green',   hex: '#34d399', glow: 'rgba(52, 211, 153, ' },
  { name: 'yellow',  hex: '#fbbf24', glow: 'rgba(251, 191, 36, ' },
];
const VORTEX_RADIUS = 45;
const PARTICLE_RADIUS_MIN = 12;
const PARTICLE_RADIUS_MAX = 22;
const LIVES_START = 3;
const COLOR_KEYS = ['1','2','3','4','q','w','e','r','Q','W','E','R'];

/* ---------- State ---------- */
let W, H;
let gameRunning = false;
let score = 0;
let combo = 0;
let lives = LIVES_START;
let currentColor = 0;
let vortex = { x: 0, y: 0 };
let particles = [];
let particlesBg = [];
let mouseX = 0, mouseY = 0;
let spawnTimer = 0;
let spawnInterval = 800; // ms
let difficulty = 1;
let lastTime = 0;
let gameTime = 0;
let cheatMode = false;
let bestScore = parseInt(localStorage.getItem('spectrumVortexBest') || '0');
let cheatyBuffer = '';
const CHEAT_CODE = 'axisihuairen';

/* ---------- Init ---------- */
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  vortex.x = W / 2;
  vortex.y = H / 2;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Color switcher UI ---------- */
const switcher = document.getElementById('colorSwitcher');
COLORS.forEach((c, i) => {
  const btn = document.createElement('div');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = c.hex;
  btn.style.color = c.glow + '0.8)';
  btn.dataset.index = i;
  btn.addEventListener('click', () => setColor(i));
  switcher.appendChild(btn);
});

function setColor(idx) {
  currentColor = idx % COLORS.length;
  document.querySelectorAll('.color-btn').forEach((b, i) => {
    b.classList.toggle('active', i === currentColor);
  });
}

/* ---------- Input ---------- */
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  vortex.x = mouseX; vortex.y = mouseY;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX; mouseY = t.clientY;
  vortex.x = mouseX; vortex.y = mouseY;
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX; mouseY = t.clientY;
  vortex.x = mouseX; vortex.y = mouseY;
}, { passive: false });

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // Color switch
  if (k === '1' || k === 'q') setColor(0);
  else if (k === '2' || k === 'w') setColor(1);
  else if (k === '3' || k === 'e') setColor(2);
  else if (k === '4' || k === 'r') setColor(3);
  // Cheat buffer
  cheatyBuffer += k;
  if (cheatyBuffer.length > CHEAT_CODE.length) {
    cheatyBuffer = cheatyBuffer.slice(-CHEAT_CODE.length);
  }
  if (cheatyBuffer === CHEAT_CODE) {
    activateCheat();
  }
});

/* ---------- Cheat ---------- */
function activateCheat() {
  cheatMode = true;
  lives = 99;
  document.getElementById('cheatIndicator').classList.add('active');
  document.getElementById('livesValue').textContent = '∞';
  document.getElementById('livesValue').style.color = '#fbbf24';
  spawnInterval = Math.max(200, spawnInterval);
  // Flash effect
  flashScreen('#fbbf24');
  cheatyBuffer = '';
}

/* ---------- Particles ---------- */
function spawnParticle() {
  // Spawn from random edge
  const side = Math.floor(Math.random() * 4);
  let x, y, vx, vy;
  const baseSpeed = 1.2 + difficulty * 0.3;
  const speed = baseSpeed + Math.random() * 0.8;
  if (side === 0) { x = Math.random() * W; y = -30; vx = (Math.random() - 0.5) * speed * 0.5; vy = speed; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; vx = -speed; vy = (Math.random() - 0.5) * speed * 0.5; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; vx = (Math.random() - 0.5) * speed * 0.5; vy = -speed; }
  else { x = -30; y = Math.random() * H; vx = speed; vy = (Math.random() - 0.5) * speed * 0.5; }

  particles.push({
    x, y, vx, vy,
    color: Math.floor(Math.random() * COLORS.length),
    radius: PARTICLE_RADIUS_MIN + Math.random() * (PARTICLE_RADIUS_MAX - PARTICLE_RADIUS_MIN),
    pulse: Math.random() * Math.PI * 2,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.05,
  });
}

function spawnBgParticle() {
  particlesBg.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    size: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.4 + 0.1,
  });
}

/* ---------- Update ---------- */
function update(dt) {
  gameTime += dt;

  // Difficulty ramp
  difficulty = 1 + Math.floor(gameTime / 15000) * 0.5;
  difficulty = Math.min(difficulty, 5);
  spawnInterval = Math.max(250, 800 - difficulty * 100);

  // Spawn particles
  spawnTimer += dt;
  while (spawnTimer >= spawnInterval) {
    spawnTimer -= spawnInterval;
    spawnParticle();
  }
  // Background stars
  if (Math.random() < 0.05) spawnBgParticle();

  // Update vortex trail (auto-glide toward mouse slightly when cheating)
  if (cheatMode) {
    // In cheat mode, gently snap toward nearest correct-color particle
    let bestDist = Infinity, best = null;
    for (const p of particles) {
      if (p.color === currentColor) {
        const d = Math.hypot(p.x - vortex.x, p.y - vortex.y);
        if (d < bestDist) { bestDist = d; best = p; }
      }
    }
    if (best && bestDist > 50) {
      vortex.x += (best.x - vortex.x) * 0.08;
      vortex.y += (best.y - vortex.y) * 0.08;
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.pulse += 0.1;
    p.rotation += p.rotSpeed;

    // Auto-correct in cheat mode
    if (cheatMode && p.color !== currentColor) {
      // Push wrong-color particles away from vortex
      const dx = p.x - vortex.x, dy = p.y - vortex.y;
      const d = Math.hypot(dx, dy);
      if (d < VORTEX_RADIUS * 2) {
        p.vx += (dx / d) * 0.15;
        p.vy += (dy / d) * 0.15;
      }
    }

    // Collision with vortex
    const dist = Math.hypot(p.x - vortex.x, p.y - vortex.y);
    if (dist < VORTEX_RADIUS + p.radius * 0.5) {
      if (p.color === currentColor || cheatMode && p.color === currentColor) {
        // Correct!
        combo++;
        const multiplier = cheatMode ? 10 : 1 + Math.floor(combo / 5) * 0.5;
        const base = 10;
        const gain = Math.round(base * multiplier);
        score += gain;
        showCombo(p.x, p.y, gain, COLORS[p.color].hex);
        flashScreen(COLORS[p.color].hex, 0.15);
      } else if (!cheatMode) {
        // Wrong!
        combo = 0;
        score = Math.max(0, score - 5);
        lives--;
        showCombo(p.x, p.y, '-5', '#f87171');
        flashScreen('#f87171', 0.3);
        if (lives <= 0) {
          gameOver();
          return;
        }
      }
      particles.splice(i, 1);
      continue;
    }

    // Offscreen cleanup
    const margin = 100;
    if (p.x < -margin || p.x > W + margin || p.y < -margin || p.y > H + margin) {
      particles.splice(i, 1);
    }
  }

  // Update background particles
  for (let i = particlesBg.length - 1; i >= 0; i--) {
    const p = particlesBg[i];
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; else if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; else if (p.y > H) p.y = 0;
    if (particlesBg.length > 80) particlesBg.splice(i, 1);
  }

  // Update HUD
  document.getElementById('scoreValue').textContent = score;
  document.getElementById('comboValue').textContent = combo + 'x';
  if (!cheatMode) {
    document.getElementById('livesValue').textContent = '♥'.repeat(Math.max(0, lives));
  }
}

/* ---------- Render ---------- */
function render() {
  // Clear
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Background radial glow
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)/2);
  bgGrad.addColorStop(0, 'rgba(88, 28, 135, 0.25)');
  bgGrad.addColorStop(0.5, 'rgba(30, 10, 60, 0.1)');
  bgGrad.addColorStop(1, 'rgba(10, 10, 26, 0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Background stars
  for (const s of particlesBg) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 180, 255, ${s.alpha})`;
    ctx.fill();
  }

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(147, 51, 234, 0.07)';
  ctx.lineWidth = 1;
  const grid = 60;
  ctx.beginPath();
  for (let x = 0; x < W; x += grid) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = 0; y < H; y += grid) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // Particles
  for (const p of particles) {
    const c = COLORS[p.color];
    const pulseScale = 1 + Math.sin(p.pulse) * 0.15;
    const r = p.radius * pulseScale;

    // Outer glow
    const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
    glowGrad.addColorStop(0, c.glow + '0.6)');
    glowGrad.addColorStop(0.4, c.glow + '0.2)');
    glowGrad.addColorStop(1, c.glow + '0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
    ctx.fill();

    // Core (rotating diamond)
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.fillStyle = c.hex;
    ctx.shadowColor = c.hex;
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.8, 0);
    ctx.lineTo(0, r);
    ctx.lineTo(-r * 0.8, 0);
    ctx.closePath();
    ctx.fill();
    // Inner highlight
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.2, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Vortex
  const c = COLORS[currentColor];
  const t = gameTime / 1000;

  // Vortex outer ring glow
  const vGlow = ctx.createRadialGradient(vortex.x, vortex.y, 0, vortex.x, vortex.y, VORTEX_RADIUS * 2);
  vGlow.addColorStop(0, c.glow + '0.5)');
  vGlow.addColorStop(0.5, c.glow + '0.15)');
  vGlow.addColorStop(1, c.glow + '0)');
  ctx.fillStyle = vGlow;
  ctx.beginPath();
  ctx.arc(vortex.x, vortex.y, VORTEX_RADIUS * 2, 0, Math.PI * 2);
  ctx.fill();

  // Rotating rings
  ctx.save();
  ctx.translate(vortex.x, vortex.y);

  for (let ring = 0; ring < 3; ring++) {
    const ringRadius = VORTEX_RADIUS - ring * 8;
    ctx.rotate(t * (1 + ring * 0.5));
    ctx.strokeStyle = c.hex;
    ctx.lineWidth = 2;
    ctx.shadowColor = c.hex;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    const segments = 6;
    for (let i = 0; i < segments; i++) {
      const a1 = (i / segments) * Math.PI * 2;
      const a2 = a1 + 0.3;
      ctx.moveTo(Math.cos(a1) * ringRadius, Math.sin(a1) * ringRadius);
      ctx.lineTo(Math.cos(a2) * ringRadius, Math.sin(a2) * ringRadius);
    }
    ctx.stroke();
  }

  // Center core
  ctx.shadowBlur = 30;
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, VORTEX_RADIUS * 0.6);
  coreGrad.addColorStop(0, '#fff');
  coreGrad.addColorStop(0.4, c.hex);
  coreGrad.addColorStop(1, c.glow + '0.3)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, VORTEX_RADIUS * 0.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ---------- Combo popup / Flash ---------- */
function showCombo(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'combo-popup';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = color;
  el.style.fontSize = text.includes('-') ? '20px' : '28px';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

let flashOpacity = 0, flashColor = '#fff';
function flashScreen(color, intensity = 0.3) {
  flashColor = color;
  flashOpacity = intensity;
}

// Override render to include flash
const origRender = render;
render = function() {
  origRender();
  if (flashOpacity > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashOpacity;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    flashOpacity *= 0.85;
    if (flashOpacity < 0.01) flashOpacity = 0;
  }
};

/* ---------- Main loop ---------- */
function loop(time) {
  if (!gameRunning) return;
  const dt = Math.min(time - lastTime, 50);
  lastTime = time;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------- Game control ---------- */
function startGame() {
  gameRunning = true;
  score = 0; combo = 0; lives = LIVES_START;
  currentColor = 0;
  particles = [];
  spawnTimer = 0;
  difficulty = 1;
  gameTime = 0;
  cheatMode = false;
  document.getElementById('cheatIndicator').classList.remove('active');
  document.getElementById('livesValue').style.color = '#f87171';
  document.getElementById('livesValue').textContent = '♥'.repeat(lives);
  document.getElementById('colorSwitcher').classList.add('visible');
  setColor(0);

  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  gameRunning = false;
  document.getElementById('colorSwitcher').classList.remove('visible');

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('spectrumVortexBest', bestScore);
  }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = bestScore;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

/* ---------- Init UI ---------- */
document.getElementById('bestScoreDisplay').textContent = bestScore;
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// Keep canvas centered visually when no game
function idleRender() {
  if (gameRunning) return;
  render();
  requestAnimationFrame(idleRender);
}
idleRender();

</script>
