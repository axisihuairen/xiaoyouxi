<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>NEON PULSE · 霓虹脉冲</title>
<style>
  :root{
    --bg-0:#05020f;
    --bg-1:#0d0625;
    --bg-2:#1a0b3d;
    --pink:#ff2d95;
    --cyan:#00f0ff;
    --purple:#b14bff;
    --yellow:#ffe74c;
    --green:#39ff14;
    --danger:#ff3366;
    --text:#e8e8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%,var(--bg-2) 0%,var(--bg-1) 45%,var(--bg-0) 100%);
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    color:var(--text);
    touch-action:none;
  }
  /* 背景网格 */
  .grid-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,45,149,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,240,255,.07) 1px,transparent 1px);
    background-size:40px 40px;
    animation:gridShift 8s linear infinite;
  }
  @keyframes gridShift{
    0%{background-position:0 0}
    100%{background-position:0 40px}
  }
  /* 扫描线 */
  .scanlines{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 3px);
    mix-blend-mode:multiply;
  }
  #wrap{
    position:relative;z-index:2;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px;
  }
  #stage{
    position:relative;
    width:min(100vw - 20px,480px);
    aspect-ratio:9/16;
    max-height:calc(100vh - 120px);
    background:linear-gradient(180deg,rgba(13,6,37,.9),rgba(5,2,15,.95));
    border-radius:16px;
    border:1px solid rgba(0,240,255,.3);
    box-shadow:
      0 0 30px rgba(0,240,255,.2),
      inset 0 0 60px rgba(177,75,255,.15);
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;}
  /* HUD */
  .hud{
    position:absolute;top:0;left:0;right:0;padding:12px 14px;
    display:flex;justify-content:space-between;align-items:center;
    pointer-events:none;font-weight:700;font-size:14px;letter-spacing:1px;
    text-shadow:0 0 8px currentColor;
    z-index:5;
  }
  .hud .score{color:var(--cyan);font-size:20px;}
  .hud .bs{color:var(--pink);font-size:13px;opacity:.85;}
  .hud .combo{color:var(--yellow);font-size:14px;}
  .cheat-badge{
    position:absolute;top:10px;right:10px;z-index:6;
    padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
    background:rgba(255,231,76,.15);border:1px solid var(--yellow);
    color:var(--yellow);text-shadow:0 0 6px var(--yellow);
    animation:badgePulse 1.2s ease-in-out infinite;
    display:none;
    pointer-events:none;
  }
  @keyframes badgePulse{
    0%,100%{box-shadow:0 0 10px rgba(255,231,76,.3)}
    50%{box-shadow:0 0 20px rgba(255,231,76,.8)}
  }
  /* 覆盖层 */
  .overlay{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,2,15,.75);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    padding:24px;text-align:center;
    transition:opacity .35s;
  }
  .overlay.hidden{opacity:0;pointer-events:none;}
  .title{
    font-size:clamp(32px,8vw,52px);font-weight:900;letter-spacing:4px;
    background:linear-gradient(90deg,var(--pink),var(--cyan),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,45,149,.5));
    margin-bottom:6px;
  }
  .subtitle{
    font-size:clamp(12px,3vw,15px);color:rgba(232,232,255,.7);letter-spacing:3px;
    margin-bottom:28px;
  }
  .big-btn{
    padding:14px 42px;font-size:16px;font-weight:800;letter-spacing:2px;
    border:2px solid var(--cyan);border-radius:12px;background:rgba(0,240,255,.08);
    color:var(--cyan);cursor:pointer;
    box-shadow:0 0 20px rgba(0,240,255,.3),inset 0 0 10px rgba(0,240,255,.15);
    transition:transform .15s,box-shadow .2s,background .2s;
    font-family:inherit;
  }
  .big-btn:hover,.big-btn:active{
    transform:scale(1.05);
    background:rgba(0,240,255,.2);
    box-shadow:0 0 35px rgba(0,240,255,.7),inset 0 0 15px rgba(0,240,255,.3);
  }
  .sm-btn{
    margin-top:14px;padding:8px 22px;font-size:12px;font-weight:600;letter-spacing:1px;
    border:1px solid rgba(232,232,255,.3);border-radius:8px;background:transparent;
    color:rgba(232,232,255,.7);cursor:pointer;font-family:inherit;
  }
  .sm-btn:active{background:rgba(255,255,255,.08);}
  .final-score{
    font-size:clamp(40px,10vw,72px);font-weight:900;color:var(--yellow);
    text-shadow:0 0 20px var(--yellow);margin:10px 0;
  }
  .final-label{font-size:13px;letter-spacing:3px;color:rgba(232,232,255,.6);}
  .hint{font-size:11px;color:rgba(232,232,255,.45);margin-top:20px;letter-spacing:1px;line-height:1.7;}
  .diff-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
  .diff-btn{
    padding:8px 18px;font-size:12px;font-weight:700;border-radius:20px;
    border:1px solid var(--purple);background:rgba(177,75,255,.08);
    color:var(--purple);cursor:pointer;font-family:inherit;letter-spacing:1px;
  }
  .diff-btn.active{background:rgba(177,75,255,.25);box-shadow:0 0 15px rgba(177,75,255,.5);}
  /* 移动端方向按钮 */
  .dpad{
    position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    display:flex;gap:14px;z-index:8;
    opacity:.85;
  }
  .dpad.hidden{display:none;}
  .dbtn{
    width:64px;height:64px;border-radius:50%;
    background:rgba(255,45,149,.12);border:2px solid var(--pink);
    color:var(--pink);font-size:26px;font-weight:900;
    box-shadow:0 0 15px rgba(255,45,149,.3),inset 0 0 10px rgba(255,45,149,.15);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .dbtn:active{
    background:rgba(255,45,149,.3);
    box-shadow:0 0 25px rgba(255,45,149,.7);
    transform:scale(.92);
  }
  /* 底部提示 */
  .foot-tip{
    margin-top:12px;font-size:10px;color:rgba(232,232,255,.35);
    letter-spacing:2px;z-index:5;position:relative;
  }
  @media (min-width:768px){
    .dpad{display:none!important;}
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanlines"></div>

<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="score">SCORE <span id="sc">0</span></div>
      <div class="combo" id="combo"></div>
      <div class="bs">BEST <span id="bs">0</span></div>
    </div>
    <div class="cheat-badge" id="cheatBadge">⚡ 作弊模式激活</div>

    <!-- 开始界面 -->
    <div class="overlay" id="startOverlay">
      <div class="title">NEON PULSE</div>
      <div class="subtitle">霓虹脉冲 · 极速闪躲</div>
      <div class="final-label" style="margin-bottom:10px;">选择难度</div>
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">简单</button>
        <button class="diff-btn active" data-diff="normal">普通</button>
        <button class="diff-btn" data-diff="hard">困难</button>
      </div>
      <button class="big-btn" id="startBtn" style="margin-top:26px;">开始游戏</button>
      <div class="hint">
        电脑：← → 或 A / D 控制<br>
        手机：左右滑动屏幕 或 下方按键<br>
        收集晶体 ✦ | 躲避红色激光 | 坚持到最后！
      </div>
    </div>

    <!-- 结束界面 -->
    <div class="overlay hidden" id="endOverlay">
      <div class="final-label">GAME OVER</div>
      <div class="final-score" id="finalScore">0</div>
      <div class="final-label" id="newBest" style="color:var(--yellow);display:none;">★ 新纪录 ★</div>
      <button class="big-btn" id="restartBtn" style="margin-top:26px;">再来一局</button>
      <button class="sm-btn" id="homeBtn">返回主页</button>
    </div>

    <!-- 暂停界面 -->
    <div class="overlay hidden" id="pauseOverlay">
      <div class="title" style="font-size:clamp(24px,6vw,40px);">PAUSED</div>
      <button class="big-btn" id="resumeBtn" style="margin-top:20px;">继续</button>
    </div>
  </div>
  <div class="foot-tip">M · NEON PULSE · 2026</div>
</div>

<!-- 方向键（移动端） -->
<div class="dpad hidden" id="dpad">
  <div class="dbtn" data-dir="left">◀</div>
  <div class="dbtn" data-dir="right">▶</div>
</div>

<script>
/* =========================================================
   NEON PULSE · 霓虹脉冲
   赛博朋克风格躲避+收集小游戏
   ========================================================= */
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const scEl = document.getElementById('sc');
  const bsEl = document.getElementById('bs');
  const comboEl = document.getElementById('combo');
  const cheatBadge = document.getElementById('cheatBadge');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const finalScore = document.getElementById('finalScore');
  const newBest = document.getElementById('newBest');
  const dpad = document.getElementById('dpad');

  /* --------- Canvas 尺寸自适应 --------- */
  let W=360, H=640;
  function resize(){
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio||1,2);
    cv.width = rect.width * dpr;
    cv.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W = rect.width;
    H = rect.height;
    // 尺寸变化时把玩家重新贴到底部，避免跑到画布外
    player.y = H - 80;
    player.x = Math.min(player.x, Math.max(0, W - player.w));
  }
  window.addEventListener('resize', resize);

  /* --------- 状态机 --------- */
  const STATE = { START:0, PLAYING:1, PAUSED:2, END:3 };
  let state = STATE.START;

  /* --------- 难度配置 --------- */
  const DIFF = {
    easy:   { spawnInterval:1350, speedMul:0.75, scoreMul:1.5 },
    normal: { spawnInterval:1000, speedMul:1.0,  scoreMul:1.0 },
    hard:   { spawnInterval:720,  speedMul:1.3,  scoreMul:0.8 }
  };
  let difficulty = 'normal';

  /* --------- 玩家 --------- */
  const player = {
    x:0, y:0, w:32, h:32,
    vx:0, speed:5,
    targetX:null,
    invincible:false,
    trail:[],
    pulse:0
  };

  /* --------- 游戏对象 --------- */
  let obstacles = [];   // 下落障碍（红色激光柱）
  let crystals = [];    // 能量晶体
  let particles = [];   // 粒子特效
  let stars = [];       // 背景星星
  let shockwaves = [];  // 冲击波

  let score = 0;
  let combo = 0;
  let comboTimer = 0;
  let bestScore = 0;
  let timeElapsed = 0;
  let spawnTimer = 0;
  let lastTs = 0;
  let cheatActive = false;
  let shake = 0;

  /* --------- 键盘输入 --------- */
  const keys = { left:false, right:false };
  const konamiTarget = 'axisihuairen';
  let konamiBuf = '';

  /* --------- 音效 --------- */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }
  function playSfx(type){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const g = audioCtx.createGain();
    g.connect(audioCtx.destination);
    if(type==='collect'){
      const o = audioCtx.createOscillator();
      o.type='sine'; o.frequency.setValueAtTime(880,now);
      o.frequency.exponentialRampToValueAtTime(1760,now+.1);
      g.gain.setValueAtTime(.25,now); g.gain.exponentialRampToValueAtTime(.001,now+.15);
      o.connect(g); o.start(now); o.stop(now+.15);
    } else if(type==='hit'){
      const o = audioCtx.createOscillator();
      o.type='sawtooth'; o.frequency.setValueAtTime(220,now);
      o.frequency.exponentialRampToValueAtTime(50,now+.3);
      g.gain.setValueAtTime(.4,now); g.gain.exponentialRampToValueAtTime(.001,now+.35);
      o.connect(g); o.start(now); o.stop(now+.35);
    } else if(type==='start'){
      [440,660,880].forEach((f,i)=>{
        const o = audioCtx.createOscillator();
        o.type='square'; o.frequency.setValueAtTime(f,now+i*.08);
        const gg = audioCtx.createGain();
        gg.gain.setValueAtTime(.15,now+i*.08); gg.gain.exponentialRampToValueAtTime(.001,now+i*.08+.15);
        o.connect(gg); gg.connect(audioCtx.destination);
        o.start(now+i*.08); o.stop(now+i*.08+.15);
      });
    } else if(type==='cheat'){
      [523,659,784,1047].forEach((f,i)=>{
        const o = audioCtx.createOscillator();
        o.type='triangle'; o.frequency.setValueAtTime(f,now+i*.06);
        const gg = audioCtx.createGain();
        gg.gain.setValueAtTime(.2,now+i*.06); gg.gain.exponentialRampToValueAtTime(.001,now+i*.06+.2);
        o.connect(gg); gg.connect(audioCtx.destination);
        o.start(now+i*.06); o.stop(now+i*.06+.2);
      });
    } else if(type==='gameover'){
      [660,440,220].forEach((f,i)=>{
        const o = audioCtx.createOscillator();
        o.type='sawtooth'; o.frequency.setValueAtTime(f,now+i*.15);
        const gg = audioCtx.createGain();
        gg.gain.setValueAtTime(.25,now+i*.15); gg.gain.exponentialRampToValueAtTime(.001,now+i*.15+.3);
        o.connect(gg); gg.connect(audioCtx.destination);
        o.start(now+i*.15); o.stop(now+i*.15+.3);
      });
    }
  }

  /* --------- 背景星星 --------- */
  function initStars(){
    stars = [];
    for(let i=0;i<60;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.5+.3,
        speed:Math.random()*0.4+0.15,
        phase:Math.random()*Math.PI*2
      });
    }
  }

  /* --------- 重置 --------- */
  function resetGame(){
    player.x = W/2 - player.w/2;
    player.y = H - 80;
    player.vx = 0;
    player.invincible = cheatActive;
    player.trail = [];
    player.pulse = 0;
    obstacles = [];
    crystals = [];
    particles = [];
    shockwaves = [];
    score = 0;
    combo = 0;
    comboTimer = 0;
    timeElapsed = 0;
    spawnTimer = -1200;   // 首个障碍延迟，给玩家一点适应时间
    shake = 0;
    initStars();
    updateHUD();
  }

  function updateHUD(){
    scEl.textContent = Math.floor(score);
    bsEl.textContent = Math.floor(bestScore);
    if(combo>=2) comboEl.textContent = combo+'x COMBO!';
    else comboEl.textContent = '';
    cheatBadge.style.display = cheatActive ? 'block' : 'none';
  }

  /* --------- 生成障碍 --------- */
  function spawnObstacle(){
    const diff = DIFF[difficulty];
    const w = 28 + Math.random()*44;
    const x = Math.random()*(W - w);
    const speed = (1.9 + Math.random()*1.5 + timeElapsed*0.0003) * diff.speedMul;
    obstacles.push({
      x, y:-40, w, h:18,
      speed,
      hue: Math.random()<0.7 ? 'danger' : 'purple',
      phase: Math.random()*Math.PI*2
    });
  }

  /* --------- 生成晶体 --------- */
  function spawnCrystal(){
    const x = 20 + Math.random()*(W - 40);
    const speed = 2.0 + Math.random()*1.2 + timeElapsed*0.0002;
    crystals.push({
      x, y:-20, size:14, speed,
      spin:0,
      hue: Math.random()<0.15 ? 'cyan' : 'yellow'
    });
  }

  /* --------- 粒子爆炸 --------- */
  function explode(x,y,color,count=18,speed=4){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const v = Math.random()*speed+1;
      particles.push({
        x, y, vx:Math.cos(ang)*v, vy:Math.sin(ang)*v,
        life:1, decay:0.02+Math.random()*0.02,
        color, size:Math.random()*3+1.5
      });
    }
  }

  function emitTrail(){
    player.trail.push({x:player.x+player.w/2, y:player.y+player.h/2, life:1});
    if(player.trail.length>12) player.trail.shift();
  }

  /* --------- 碰撞检测 --------- */
  function collide(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }
  function circleRectHit(cx,cy,cr,rx,ry,rw,rh){
    const nx = Math.max(rx,Math.min(cx,rx+rw));
    const ny = Math.max(ry,Math.min(cy,ry+rh));
    const dx = cx-nx, dy = cy-ny;
    return dx*dx+dy*dy < cr*cr;
  }

  /* --------- 更新逻辑 --------- */
  function update(dt){
    timeElapsed += dt;
    const diff = DIFF[difficulty];

    // --- 输入 -> 玩家 ---
    let ax = 0;
    if(keys.left) ax -= 1;
    if(keys.right) ax += 1;
    const targetSpeed = ax * player.speed;
    player.vx += (targetSpeed - player.vx) * 0.28;

    player.x += player.vx;
    // 边界
    if(player.x < 0){ player.x = 0; player.vx = 0; }
    if(player.x + player.w > W){ player.x = W - player.w; player.vx = 0; }

    // 自动吸附（作弊模式）
    if(cheatActive && obstacles.length>0){
      let nearest = null, nd = Infinity;
      for(const o of obstacles){
        if(o.y < player.y - 80) continue;
        const ox = o.x + o.w/2;
        const d = Math.abs(ox - (player.x+player.w/2));
        if(d<nd){ nd=d; nearest=o; }
      }
      if(nearest){
        const desired = nearest.x + nearest.w/2 - player.w/2;
        player.x += (desired - player.x) * 0.12;
        player.vx = (desired - player.x) * 0.12;
      }
    }

    emitTrail();
    for(const t of player.trail) t.life -= 0.06;
    player.trail = player.trail.filter(t=>t.life>0);

    player.pulse += dt * 0.005;

    // --- 背景星星 ---
    for(const s of stars){
      s.y += s.speed * (1 + timeElapsed*0.0002);
      s.phase += 0.05;
      if(s.y > H){ s.y = -2; s.x = Math.random()*W; }
    }

    // --- 生成 ---
    spawnTimer += dt;
    const interval = Math.max(380, diff.spawnInterval - timeElapsed*0.08);
    while(spawnTimer > interval){
      spawnTimer -= interval;
      spawnObstacle();
      if(Math.random() < 0.65) spawnCrystal();
    }

    // --- 障碍 ---
    for(const o of obstacles){
      o.y += o.speed;
      o.phase += 0.12;
    }
    obstacles = obstacles.filter(o => o.y < H + 60);

    // --- 晶体 ---
    for(const c of crystals){
      c.y += c.speed;
      c.spin += 0.08;
    }
    crystals = crystals.filter(c => c.y < H + 40);

    // --- 碰撞：玩家 vs 障碍 ---
    if(!player.invincible){
      for(const o of obstacles){
        if(collide({x:player.x+3,y:player.y+3,w:player.w-6,h:player.h-6},o)){
          gameOver();
          return;
        }
      }
    }

    // --- 碰撞：玩家 vs 晶体 ---
    const pcx = player.x + player.w/2, pcy = player.y + player.h/2;
    for(let i=crystals.length-1;i>=0;i--){
      const c = crystals[i];
      // 作弊模式：自动吸附
      if(cheatActive){
        const dx = pcx - c.x, dy = pcy - c.y;
        const d = Math.hypot(dx,dy);
        if(d < 100){
          c.x += dx * 0.12;
          c.y += dy * 0.12;
        }
      }
      if(circleRectHit(c.x,c.y,c.size,player.x,player.y,player.w,player.h)){
        const pts = c.hue==='cyan' ? 50 : 20;
        score += pts * diff.scoreMul * (1 + combo*0.1);
        combo++;
        comboTimer = 120;
        explode(c.x,c.y,c.hue==='cyan'?'#00f0ff':'#ffe74c',12,3);
        playSfx('collect');
        shockwaves.push({x:c.x,y:c.y,r:6,maxR:40,color:c.hue==='cyan'?'#00f0ff':'#ffe74c',life:1});
        crystals.splice(i,1);
      }
    }

    // --- combo 计时 ---
    if(comboTimer>0){
      comboTimer -= dt/16;
      if(comboTimer<=0) combo=0;
    }

    // --- 加分：生存时间 ---
    score += dt * 0.012 * diff.scoreMul;

    // --- 粒子 ---
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.06;
      p.life -= p.decay;
    }
    particles = particles.filter(p=>p.life>0);

    // --- 冲击波 ---
    for(const s of shockwaves){
      s.r += (s.maxR - s.r) * 0.12;
      s.life -= 0.08;
    }
    shockwaves = shockwaves.filter(s=>s.life>0);

    // --- 屏幕震动 ---
    if(shake>0) shake -= dt*0.02;

    updateHUD();
  }

  /* --------- 渲染 --------- */
  function render(){
    ctx.save();
    // 震动偏移
    if(shake>0){
      ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    }

    // --- 清屏（透明，保留舞台渐变背景）---
    ctx.clearRect(0,0,W,H);

    // --- 星星 ---
    for(const s of stars){
      const twinkle = 0.5 + 0.5*Math.sin(s.phase);
      ctx.fillStyle = `rgba(200,220,255,${twinkle*0.8})`;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }

    // --- 冲击波 ---
    for(const s of shockwaves){
      ctx.strokeStyle = s.color;
      ctx.globalAlpha = s.life * 0.8;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // --- 障碍 ---
    for(const o of obstacles){
      const glow = 0.6 + 0.4*Math.sin(o.phase);
      const color = o.hue==='danger' ? '#ff3366' : '#b14bff';
      const shadow = o.hue==='danger' ? '#ff3366' : '#b14bff';
      ctx.save();
      ctx.shadowColor = shadow;
      ctx.shadowBlur = 18*glow;
      ctx.fillStyle = color;
      // 尖刺顶
      ctx.beginPath();
      ctx.moveTo(o.x + o.w*0.15, o.y);
      ctx.lineTo(o.x + o.w*0.5, o.y - 10);
      ctx.lineTo(o.x + o.w*0.85, o.y);
      ctx.closePath();
      ctx.fill();
      // 主体
      ctx.fillRect(o.x, o.y, o.w, o.h);
      // 高光条
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fillRect(o.x+2, o.y+3, o.w-4, 2);
      ctx.restore();
    }

    // --- 晶体 ---
    for(const c of crystals){
      ctx.save();
      ctx.translate(c.x,c.y);
      ctx.rotate(c.spin);
      const color = c.hue==='cyan' ? '#00f0ff' : '#ffe74c';
      const glow = c.hue==='cyan' ? 'rgba(0,240,255,' : 'rgba(255,231,76,';
      ctx.shadowColor = color;
      ctx.shadowBlur = 20;
      // 菱形
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0,-c.size);
      ctx.lineTo(c.size*0.7,0);
      ctx.lineTo(0,c.size);
      ctx.lineTo(-c.size*0.7,0);
      ctx.closePath();
      ctx.fill();
      // 内部高光
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath();
      ctx.moveTo(0,-c.size*0.5);
      ctx.lineTo(c.size*0.2,0);
      ctx.lineTo(0,c.size*0.3);
      ctx.lineTo(-c.size*0.2,0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // --- 玩家拖尾 ---
    for(let i=0;i<player.trail.length;i++){
      const t = player.trail[i];
      const alpha = t.life * 0.5;
      const size = player.w * 0.3 * t.life;
      ctx.save();
      ctx.fillStyle = cheatActive ? '#ffe74c' : '#00f0ff';
      ctx.globalAlpha = alpha;
      ctx.shadowColor = cheatActive ? '#ffe74c' : '#00f0ff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(t.x,t.y,size,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // --- 玩家 ---
    const pulseSize = 1 + Math.sin(player.pulse*2) * 0.06;
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.scale(pulseSize, pulseSize);
    const col = cheatActive ? '#ffe74c' : (player.invincible ? '#39ff14' : '#ff2d95');
    const col2 = cheatActive ? '#ff9900' : (player.invincible ? '#00ff88' : '#b14bff');
    ctx.shadowColor = col;
    ctx.shadowBlur = 25;
    // 外六边形
    ctx.fillStyle = col;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const ang = Math.PI/3*i - Math.PI/2;
      const r = player.w/2;
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    // 内六边形
    ctx.shadowBlur = 10;
    ctx.fillStyle = col2;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const ang = Math.PI/3*i - Math.PI/2;
      const r = player.w/3.2;
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    // 中心点
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0,0,2.5,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // --- 粒子 ---
    for(const p of particles){
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // --- 开局操作提示（3 秒内淡出）---
    if(state === STATE.PLAYING && timeElapsed < 3200){
      const a = timeElapsed < 2300 ? 1 : Math.max(0, 1 - (timeElapsed-2300)/900);
      const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 14;
      ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(coarse ? '滑动屏幕 或 按 ◀ ▶ 移动' : '← → 或 A / D 左右移动', W/2, H*0.40);
      ctx.fillStyle = '#ffe74c';
      ctx.shadowColor = '#ffe74c';
      ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('躲开红色激光 · 收集晶体得分', W/2, H*0.40 + 26);
      ctx.restore();
    }

    ctx.restore();
  }

  /* --------- 主循环 --------- */
  function loop(ts){
    if(!lastTs) lastTs = ts;
    const dt = Math.min(32, ts - lastTs);
    lastTs = ts;

    if(state === STATE.PLAYING){
      update(dt);
    }
    render();

    requestAnimationFrame(loop);
  }

  /* --------- 游戏流程 --------- */
  function startGame(){
    ensureAudio();
    playSfx('start');
    resetGame();
    state = STATE.PLAYING;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
  }
  function gameOver(){
    if(state !== STATE.PLAYING) return;
    state = STATE.END;
    shake = 20;
    player.invincible = true; // 死亡瞬间显示
    explode(player.x+player.w/2, player.y+player.h/2, '#ff2d95', 32, 6);
    explode(player.x+player.w/2, player.y+player.h/2, '#ffe74c', 20, 4);
    playSfx('hit');
    playSfx('gameover');

    const finalVal = Math.floor(score);
    const isNew = finalVal > bestScore;
    if(isNew){
      bestScore = finalVal;
      try{ localStorage.setItem('neonpulse_best', bestScore); }catch(e){}
    }
    finalScore.textContent = finalVal;
    newBest.style.display = isNew ? 'block' : 'none';
    updateHUD();

    setTimeout(()=>{
      endOverlay.classList.remove('hidden');
      player.invincible = cheatActive;
    }, 800);
  }
  function backToHome(){
    state = STATE.START;
    startOverlay.classList.remove('hidden');
    endOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
  }
  function togglePause(){
    if(state === STATE.PLAYING){
      state = STATE.PAUSED;
      pauseOverlay.classList.remove('hidden');
    } else if(state === STATE.PAUSED){
      state = STATE.PLAYING;
      pauseOverlay.classList.add('hidden');
    }
  }

  /* --------- 作弊码 --------- */
  function checkKonami(input){
    const target = konamiTarget;
    let i = 0;
    for(const ch of input){
      if(ch === target[i]){
        i++;
        if(i === target.length){
          return true;
        }
      } else {
        i = ch === target[0] ? 1 : 0;
      }
    }
    return false;
  }
  function triggerCheat(){
    cheatActive = !cheatActive;
    player.invincible = cheatActive || (state === STATE.START);
    playSfx('cheat');
    explode(player.x+player.w/2, player.y+player.h/2, '#ffe74c', 40, 7);
    if(cheatActive){
      shockwaves.push({x:player.x+player.w/2, y:player.y+player.h/2, r:10, maxR:200, color:'#ffe74c', life:1});
      shockwaves.push({x:player.x+player.w/2, y:player.y+player.h/2, r:10, maxR:150, color:'#00f0ff', life:1});
    }
    updateHUD();
  }

  /* --------- 键盘事件 --------- */
  document.addEventListener('keydown', e=>{
    // 全局作弊码
    konamiBuf += e.key.toLowerCase();
    if(konamiBuf.length > konamiTarget.length + 3){
      konamiBuf = konamiBuf.slice(-konamiTarget.length);
    }
    if(checkKonami(konamiBuf)){
      triggerCheat();
      konamiBuf = '';
    }

    if(e.code==='ArrowLeft' || e.key==='a' || e.key==='A') keys.left = true;
    if(e.code==='ArrowRight' || e.key==='d' || e.key==='D') keys.right = true;
    if(e.code==='Space'){
      if(state===STATE.START){ startGame(); e.preventDefault(); }
      else if(state===STATE.END){ startGame(); e.preventDefault(); }
      else if(state===STATE.PLAYING || state===STATE.PAUSED){ togglePause(); e.preventDefault(); }
    }
    if(e.key==='Escape' || e.key==='p' || e.key==='P'){
      if(state===STATE.PLAYING || state===STATE.PAUSED){ togglePause(); }
    }
  });
  document.addEventListener('keyup', e=>{
    if(e.code==='ArrowLeft' || e.key==='a' || e.key==='A') keys.left = false;
    if(e.code==='ArrowRight' || e.key==='d' || e.key==='D') keys.right = false;
  });

  /* --------- 触摸控制 --------- */
  let touchStartX = null, touchStartY = null;
  let keyHoldTimer = null;
  function holdKey(dir, on){
    keys[dir] = on;
  }
  stage.addEventListener('touchstart', e=>{
    // 点在按钮/弹层上时不拦截，保证 click 能正常触发
    if(e.target.closest('.overlay') || e.target.closest('button')) return;
    const t = e.touches[0];
    if(!t) return;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    ensureAudio();
    if(state===STATE.PLAYING){
      // 直接按屏幕半区控制
      const rect = stage.getBoundingClientRect();
      const localX = t.clientX - rect.left;
      if(localX < rect.width/2) keys.left = true; else keys.right = true;
    }
    e.preventDefault();
  }, {passive:false});
  stage.addEventListener('touchmove', e=>{
    if(e.target.closest('.overlay') || e.target.closest('button')) return;
    if(state!==STATE.PLAYING) return;
    const t = e.touches[0];
    if(!t) return;
    const rect = stage.getBoundingClientRect();
    const localX = t.clientX - rect.left;
    keys.left = localX < rect.width/2;
    keys.right = localX >= rect.width/2;
    e.preventDefault();
  }, {passive:false});
  ['touchend','touchcancel'].forEach(ev=>{
    stage.addEventListener(ev, e=>{
      keys.left = false; keys.right = false;
      touchStartX = null;
    });
  });

  /* --------- 虚拟按键（移动端） --------- */
  function isMobile(){
    return 'ontouchstart' in window || navigator.maxTouchPoints > 0 || window.innerWidth < 768;
  }
  if(isMobile()) dpad.classList.remove('hidden');
  window.addEventListener('resize', ()=>{
    if(isMobile()) dpad.classList.remove('hidden');
    else dpad.classList.add('hidden');
  });

  dpad.querySelectorAll('.dbtn').forEach(btn=>{
    const dir = btn.dataset.dir;
    const start = e=>{ ensureAudio(); keys[dir]=true; e.preventDefault(); };
    const end = e=>{ keys[dir]=false; e.preventDefault(); };
    btn.addEventListener('touchstart', start, {passive:false});
    btn.addEventListener('touchend', end, {passive:false});
    btn.addEventListener('touchcancel', end, {passive:false});
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
  });

  /* --------- UI 按钮 --------- */
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('homeBtn').addEventListener('click', backToHome);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      difficulty = btn.dataset.diff;
    });
  });

  // 点击作弊（备用）：在开始界面连续点击标题10次
  let startClicks = 0, lastClickT = 0;
  document.querySelector('.title')?.addEventListener('click', ()=>{
    const now = performance.now();
    if(now - lastClickT < 800) startClicks++; else startClicks = 1;
    lastClickT = now;
    if(startClicks >= 10){
      triggerCheat();
      startClicks = 0;
    }
  });

  /* --------- 最高分 --------- */
  try{ bestScore = parseInt(localStorage.getItem('neonpulse_best')) || 0; }catch(e){}

  /* --------- 启动 --------- */
  resize();
  initStars();
  resetGame();
  requestAnimationFrame(loop);

  // 防止移动端下拉
  document.body.addEventListener('touchmove', e=>{
    if(e.target.closest('#stage')) e.preventDefault();
  }, {passive:false});

})();
</script>
</body>
</html>
